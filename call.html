<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>اتصال بالزبون</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1a10;color:#f3efe3;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;text-align:center;padding:16px}
.c{max-width:340px;width:100%}
.n{font-size:28px;letter-spacing:1px;direction:ltr;margin:14px 0 22px}
a.b{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:999px;background:#e0b04a;color:#1b1405;font-weight:700;font-size:18px;text-decoration:none}
p{color:#b9b6a6;font-size:14px}
</style>
</head>
<body>
<div class="c">
<h2>اتصال بالزبون</h2>
<div class="n" id="n"></div>
<a class="b" id="a" href="#">📞 اتصل الآن</a>
<p id="m">إن لم تفتح لوحة الاتصال تلقائيًا فاضغط الزر.</p>
</div>
<script>
(function(){
  var d=(location.hash||'').replace(/\D/g,'');
  if(!/^0[567]\d{8}$/.test(d)){document.getElementById('m').textContent='رقم غير صالح';document.getElementById('a').style.display='none';return}
  var tel='tel:+213'+d.slice(1);
  document.getElementById('n').textContent=d.replace(/(\d{4})(\d{2})(\d{2})(\d{2})/,'$1 $2 $3 $4');
  document.getElementById('a').href=tel;
  location.replace(tel);
})();
</script>
</body>
</html>
