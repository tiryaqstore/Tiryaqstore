<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وادي ترياق</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: two separate areas. SHOP = living forest photograph (WebGL) with frosted-glass views (home, store, product pages). ADMIN = its own full-screen app with a sidebar (top strip on phones), one page per section, no forest. Colours come from the photo: forest green, sunlight gold, cream, moss, sky. */
:root{
  --bg:#0B1510; --ink:#F2F4EA; --ink-2:rgba(242,244,234,.78); --ink-3:rgba(242,244,234,.68);
  --gold:#F0C46A; --gold-ink:#1B1407; --moss:#A5CC84; --sky:#97CBEE; --coral:#FFA494; --amber:#F2C46D;
  --glass:rgba(13,26,18,.54); --glass-2:rgba(13,26,18,.72); --glass-line:rgba(255,255,255,.17); --glass-hi:rgba(255,255,255,.14);
  --field:rgba(255,255,255,.09); --field-line:rgba(255,255,255,.22);
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --u:min(calc(100vw/1600),calc(100vh/900));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{direction:rtl}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
body[data-view="home"][data-area="shop"]{touch-action:none;user-select:none;-webkit-user-select:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.25;text-wrap:balance}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#valley{position:fixed;inset:0;background:var(--bg) center/cover no-repeat}
#valley canvas{display:block;width:100%!important;height:100%!important}
.blk{position:relative}

/* ===== glass + entrance ===== */
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:20px;
  box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 50px -20px rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(0px) saturate(1);backdrop-filter:blur(0px) saturate(1)}
.view.on .glass{-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-2)}}
.rise{opacity:0;transform:translateY(22px) scale(.985);
  transition:opacity .55s var(--ease),transform .55s var(--ease),-webkit-backdrop-filter .8s var(--ease),backdrop-filter .8s var(--ease),filter .6s var(--ease)}
.soft{filter:none}
.view.on .rise{opacity:1;transform:none;filter:none;transition-duration:.9s,.9s,.9s,.9s,.9s;transition-delay:calc(var(--i,0)*70ms + 140ms)}
.view{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;visibility:hidden;pointer-events:none;transition:visibility 0s linear .9s;-webkit-overflow-scrolling:touch}
.view.on{visibility:visible;pointer-events:auto;transition-delay:0s}
#v-home{overflow:hidden}
.page{max-width:1080px;margin-inline:auto;display:grid;gap:18px;
  padding-top:calc(96px + env(safe-area-inset-top,0px));padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== shop header ===== */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top>*{pointer-events:auto}
.logo{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;text-shadow:0 0 14px rgba(5,12,8,.9),0 1px 3px rgba(5,12,8,.8)}
.nav{display:flex;gap:4px;padding:4px;border-radius:999px;-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi)}
.nav a{display:inline-flex;align-items:center;height:40px;padding:0 20px;border-radius:999px;font-weight:500;font-size:15px;color:var(--ink-2);transition:background .35s var(--ease),color .35s var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:#10150f}
.tools{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-weight:600;transition:transform .3s var(--ease),filter .3s;text-align:center}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn.ghost{background:var(--field);color:var(--ink);border:1px solid var(--field-line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.danger{background:rgba(255,164,148,.16);color:var(--coral);border:1px solid rgba(255,164,148,.5)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:inset 0 1px 0 var(--glass-hi)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .w{transition:opacity .3s}.icon-btn[aria-pressed=false] .w{opacity:0}.icon-btn[aria-pressed=true] .x{opacity:0}

/* ===== home ===== */
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.hero.rise{transform:translateY(calc(-46% + 22px))}
.view.on .hero.rise{transform:translateY(-46%)}
h1.h-title{font-size:calc(132*var(--u));line-height:1.05;text-shadow:0 2px 40px rgba(5,12,8,.7),0 0 6px rgba(5,12,8,.35)}
.cap{margin-top:calc(34*var(--u));font-size:calc(22*var(--u));line-height:1.65;white-space:pre-line;text-shadow:0 1px 18px rgba(5,12,8,.85),0 0 4px rgba(5,12,8,.4)}
.go{display:grid;place-items:center;margin-top:calc(30*var(--u));width:calc(62*var(--u));height:calc(62*var(--u));min-width:52px;min-height:52px;border:1.5px solid var(--ink);border-radius:50%;background:rgba(11,21,16,.28);transition:background .35s,color .35s;touch-action:none}
.go:hover,.go.held{background:var(--ink);color:#10150f}
.go svg{width:calc(24*var(--u));height:calc(24*var(--u));min-width:20px;min-height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hint{position:absolute;display:flex;align-items:center;gap:14px;font-size:15px;font-weight:500;text-shadow:0 1px 12px rgba(5,12,8,.8);
  inset-inline-end:max(44px,env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.hint i{width:1px;height:24px;background:var(--glass-line)}

/* ===== store ===== */
.intro{padding:18px 22px}
.intro h2{font-size:clamp(30px,5vw,44px);text-shadow:0 2px 24px rgba(5,12,8,.6)}
.intro p{color:var(--ink-2);max-width:56ch}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.trust>div{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;font-size:15px}
.trust svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.card{display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;transition:transform .3s var(--ease),opacity .9s var(--ease)}
.card:hover{transform:translateY(-3px)}
.card .pic{display:grid;place-items:center;height:176px;background:radial-gradient(70% 80% at 50% 45%,rgba(240,196,106,.22),rgba(240,196,106,0) 70%)}
.card .pic svg{height:140px;width:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.card .body{display:flex;flex-direction:column;gap:6px;padding:4px 16px 16px;flex:1}
.card h3{font-size:19px}
.card .meta{color:var(--ink-2);font-size:14px}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.cue{font-size:14px;font-weight:600;color:var(--gold)}
.price{font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.price s,.pprice s{color:var(--ink-3);font-weight:400;font-size:13px;margin-inline-start:8px}
.tag{align-self:flex-start;font-size:12px;font-weight:600;color:var(--gold-ink);background:var(--gold);border-radius:99px;padding:1px 10px}
.stk{display:inline-block;align-self:flex-start;font-size:13px;font-weight:600;border-radius:99px;padding:1px 12px;border:1px solid currentColor}
.stk.ok{color:var(--moss)}.stk.low{color:var(--amber)}.stk.out{color:var(--coral)}
.vis-ctl{position:absolute;top:10px;inset-inline-end:10px;z-index:3;padding:4px 12px;border-radius:99px;background:var(--ink);color:#10150f;font-size:13px;font-weight:600;display:none}
body.editing .vis-ctl{display:block}
.h2{font-size:clamp(24px,4vw,32px);margin-top:10px;text-shadow:0 2px 20px rgba(5,12,8,.6)}
.foot{display:grid;gap:4px;padding-top:18px;color:var(--ink-3);font-size:13px;text-shadow:0 1px 10px rgba(5,12,8,.8)}
.foot a{text-decoration:underline;text-underline-offset:3px}

/* ===== product page ===== */
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);text-shadow:0 1px 10px rgba(5,12,8,.8)}
.crumbs a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
@media (max-width:780px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.ppic{display:grid;place-items:center;min-height:340px;background-image:radial-gradient(60% 60% at 50% 48%,rgba(240,196,106,.24),rgba(240,196,106,0) 72%)}
.ppic svg{height:300px;width:auto;max-width:100%;filter:drop-shadow(0 18px 26px rgba(0,0,0,.5))}
.pinfo{padding:22px;display:grid;gap:12px;align-content:start}
.ptitle{font-size:clamp(26px,4vw,36px)}
.pprice b{font-size:28px;font-variant-numeric:tabular-nums}
.pdesc{color:var(--ink-2)}
.pfeat{list-style:none;display:grid;gap:8px}
.pfeat li{display:flex;gap:10px;align-items:flex-start}
.pfeat li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:11px}
.pfeat li span{flex:1}
.li-del,.add-feat{display:none}
body.editing .li-del{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#2a0d08;font-weight:700}
body.editing .add-feat{display:inline-flex}
.order{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:780px){.order{grid-template-columns:minmax(0,1fr)}}
.panel{padding:20px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.fields{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
label,.lbl{font-size:14px;font-weight:500;color:var(--ink-2)}
input,select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;background:var(--field);border:1px solid var(--field-line);transition:border-color .25s,background .25s}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.12)}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--coral)}
select option{background:#14241A;color:var(--ink)}
.err{color:var(--coral);font-size:13px;min-height:1.3em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg label{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--field-line);background:var(--field);cursor:pointer;color:var(--ink);transition:border-color .25s,background .25s}
.seg input{width:auto;min-height:0;accent-color:var(--gold)}
.seg label:has(input:checked){border-color:var(--gold);background:rgba(240,196,106,.16)}
.qty{display:flex;align-items:center;width:max-content;border-radius:12px;border:1px solid var(--field-line);background:var(--field);overflow:hidden}
.qty button{width:46px;height:46px;font-size:20px}
.qty output{min-width:38px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.sum h3{font-size:19px;margin-bottom:12px}
.sum dl{display:grid;gap:10px}
.sum .r{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sum .r.t{border-top:1px dashed var(--glass-line);padding-top:12px;font-weight:600;font-size:18px}
.sum .r.d dd{color:var(--moss)}
.sum dt{color:var(--ink-2)}.sum dd{margin:0;font-variant-numeric:tabular-nums;text-align:end}
.note{font-size:13px;color:var(--ink-3)}
.done{display:none;padding:20px;border-color:rgba(165,204,132,.6)}
.done.show{display:block;animation:fadeUp .8s var(--ease)}
.done h3{color:var(--moss);font-size:22px;margin-bottom:4px}
.buybar{display:none;position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding:10px 12px;border-radius:20px;gap:12px;align-items:center;justify-content:space-between;background:var(--glass-2);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 40px -16px rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3)}
.buybar div{min-width:0}.buybar b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buybar span{font-size:14px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ===== live edit mode ===== */
.blk-ctl{display:none;position:absolute;top:-12px;inset-inline-start:-12px;z-index:4;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#2a0d08;font-weight:700;font-size:17px;line-height:1;place-items:center}
body.editing .blk-ctl{display:grid}
.ghost .blk-ctl{background:var(--moss)}
.is-hidden{display:none!important}
body.editing .ghost{opacity:.4!important}
body.editing [contenteditable="true"]{outline:1px dashed rgba(240,196,106,.75);outline-offset:4px;border-radius:4px;cursor:text}
body.editing [contenteditable="true"]:focus{outline:2px solid var(--gold)}
#editbar{display:none;position:fixed;z-index:8;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);
  gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 14px;border-radius:18px;background:var(--glass-2);border:1px solid var(--gold);box-shadow:0 14px 40px -10px rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
body.editing #editbar{display:flex}
#editbar span{font-size:14px;font-weight:500}
body.editing .dock{display:none}

/* ===== loader + dock ===== */
.dock{display:none}
.loader{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--bg);transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}


@media (max-width:820px){
  :root{--u:1px}
  .nav,.tools .pillbtn{display:none}
  .logo{font-size:30px}
  h1.h-title{font-size:clamp(46px,15vw,84px)}
  .cap{font-size:17px;margin-top:20px}
  .go{margin-top:24px;width:58px;height:58px}
  .hint{inset-inline-end:auto;left:0;right:0;justify-content:center;bottom:calc(96px + env(safe-area-inset-bottom,0px));font-size:14px}
  .hint .only-d,.hint i{display:none}
  .page{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  body[data-view="product"] .page{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
  .dock{display:flex;position:fixed;z-index:5;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
    padding:6px;border-radius:24px;gap:4px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 40px -16px rgba(0,0,0,.7);
    -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3)}
  .dock a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:18px;font-size:12px;font-weight:500;color:var(--ink-2);transition:background .35s var(--ease),color .35s var(--ease)}
  .dock a[aria-current="page"]{background:var(--ink);color:#10150f}
  .dock svg{width:var(--ico-dock,22px);height:var(--ico-dock,22px);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  body[data-area="shop"][data-view="product"] .buybar{display:flex}
  body[data-view="product"] .dock{display:none}
}
@media (prefers-reduced-motion:reduce){
  .rise,.view.on .rise{transition-duration:.01s;transition-delay:0s}
  .loader span{animation:none}.done.show{animation:none}
}
#intro{position:absolute;inset:0;pointer-events:none}
.lg-big{position:fixed;left:50%;top:50%;width:min(78vw,620px);height:auto;transform:translate(-50%,-50%);filter:drop-shadow(0 0 3px rgba(255,250,230,.5)) drop-shadow(0 0 16px rgba(255,250,230,.22));will-change:transform;transition:transform 1.1s var(--ease)}
body.intro-up .lg-big{transform:translate(-50%,calc(-50% + var(--lgy,-200px))) scale(var(--lgs,.4))}
.ims{position:fixed;left:0;right:0;top:calc(250px + env(safe-area-inset-top,0px));display:grid;gap:10px;justify-items:center;text-align:center;padding-inline:16px}
.im{min-height:1.5em;font-weight:400;font-size:clamp(18px,4.8vw,26px);line-height:1.5;opacity:0;transform:translateY(6px);animation:imIn 1s ease-out forwards;text-shadow:0 1px 14px rgba(5,12,8,.85)}
@keyframes imIn{to{opacity:.82;transform:none}}
body.intro-out #intro{opacity:0;transition:opacity .8s}
#intro .go{position:absolute;left:50%;bottom:calc(36px + env(safe-area-inset-bottom,0px));margin:0;transform:translateX(-50%);pointer-events:auto}
.hint{display:none!important}
.top .logo{transition:opacity .5s}
.top .logo img{display:block;height:var(--logo-h,40px);width:auto;filter:drop-shadow(0 0 3px rgba(255,250,230,.5)) drop-shadow(0 0 12px rgba(255,250,230,.22))}
body[data-view="home"] .top .logo,body.scrolled .top .logo{opacity:0;pointer-events:none}
body.intro-gone #intro{opacity:0!important;transition:none!important}
#shint{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .6s;text-shadow:0 1px 10px rgba(5,12,8,.8)}
#shint.on{opacity:.55}
#shint svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:shb 1.6s ease-in-out infinite}
@keyframes shb{50%{transform:translateY(6px)}}
body[data-view="home"] #shint{display:none}
.strip{display:flex;align-items:center;min-height:60px}
.defbox{position:relative;z-index:2;padding:11px 15px;border-radius:16px;max-width:min(58%,320px);flex:0 1 auto}
.defbox p{font-family:var(--f-display);font-size:var(--def-fs,15px);font-weight:600;line-height:1.5}
.tks{display:grid;gap:5px;padding-inline-start:14px;font-size:var(--tk-fs,12px);color:var(--ink-2)}
.tk{display:flex;align-items:center;gap:6px;opacity:0;text-shadow:0 1px 8px rgba(5,12,8,.8)}
.tk i{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none}
.tk b{font-weight:400}
.view.on .tk{animation:tkIn .7s var(--ease) both;animation-delay:var(--d,1s)}
@keyframes tkIn{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
.pblk{padding:16px 20px;color:var(--ink-2);line-height:1.9}
.blks{display:flex;flex-wrap:wrap;gap:12px}.blk2{display:flex;min-width:0}.blk2>.pblk,.blk2>.pimg,.blk2>.h2{width:100%}.blk2>.h2{margin-top:0}.blk2>*{max-width:100%}
.pblk{white-space:pre-line}.pimg img{object-fit:cover}
.ppic img{display:block;max-width:100%;max-height:340px;border-radius:14px}.card .pic img{width:100%;height:100%;object-fit:cover}

.pimg{padding:8px;overflow:hidden}
.pimg img{display:block;width:100%;height:auto;border-radius:14px}

.gal{position:relative;width:100%;height:100%;overflow:hidden}
.gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
.gal img.on{opacity:1}
.gal-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.gal{touch-action:pan-y}
.gal-dots{gap:8px}
.gal-dots button{position:relative;width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.5);cursor:pointer}
.gal-dots button::after{content:'';position:absolute;inset:-9px}
.gal-dots button.on{background:#fff}
.gal-nav{direction:ltr;unicode-bidi:isolate;position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:22px;line-height:32px;padding:0;cursor:pointer}
.gal-l{left:8px}.gal-r{right:8px}
.ptr{position:fixed;top:-50px;left:50%;transform:translateX(-50%);z-index:90;padding:8px 16px;border-radius:20px;background:rgba(15,25,15,.92);color:#fff;font-size:13px;pointer-events:none;transition:top .18s}

.card.hasimg{min-height:300px;justify-content:flex-end}
.card.hasimg .pic{position:absolute;inset:0;height:auto;display:block;background:none}
.card.hasimg .pic img{width:100%;height:100%;object-fit:cover;border-radius:0}
.card.hasimg .body{position:relative;z-index:1;margin-top:auto;padding:80px 16px 16px;background:linear-gradient(to top,rgba(6,12,7,.97) 0%,rgba(6,12,7,.85) 40%,rgba(6,12,7,0) 100%)}
.card.hasimg h3,.card.hasimg .price{color:#fff}
.ppic.hasimg{display:block;position:relative;min-height:0;aspect-ratio:1/1;max-height:560px;padding:0;overflow:hidden}
.ppic .gal{position:absolute;inset:0}
.ppic .gal img{max-height:none;max-width:none;border-radius:0}
@media (max-width:820px){.view.on .glass{-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2)}}

.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}.hrow .h2{margin:0}
.backbtn{flex:none;margin-inline-start:auto;padding:8px 14px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(240,196,106,.55);transform:scale(1)}15%{transform:scale(1.05)}60%{box-shadow:0 0 0 16px rgba(240,196,106,0)}100%{box-shadow:0 0 0 0 rgba(240,196,106,0);transform:scale(1)}}
.buybar .btn{animation:ring 2s ease-out infinite}
body.ordered .buybar{display:none!important}
body.booting .view,body.booting #intro{visibility:hidden!important}
@media (min-width:821px){body[data-area="shop"][data-view="product"] .buybar{display:flex;left:50%;right:auto;transform:translateX(-50%);width:min(420px,92vw)}}
@media (prefers-reduced-motion:reduce){.buybar .btn{animation:none}}
</style>

  var ac=null,master=null,lp=null,send=null,dry=null,muted=true,timers=[],soundBtn=$('sound');
  function rnd(a,b){return a+Math.random()*(b-a)}
  function impulse(sec){var len=ac.sampleRate*sec,b=ac.createBuffer(2,len,ac.sampleRate);for(var c=0;c<2;c++){var d=b.getChannelData(c);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}return b}

  function initAudio(){
    if(ac)return;var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=new AC();master=ac.createGain();master.gain.value=0;
    lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9000;lp.Q.value=.3;lp.connect(master);master.connect(ac.destination);

    var wb=whiteBuf();

        ' float vg=smoothstep(.5,1.3,length((vUv-.5)*vec2(uAspect*.7,1.)*1.5));col*=1.-vg*(.4+uSpeed*.3);',
        ' col+=glow*.1*vec3(1.,.95,.7)*(1.-uDisp);',
        ' col=mix(col,col*.72,uDisp*.55);',
        ' gl_FragColor=vec4(col,1.);',
        '}'].join('\n')
    }));
    plane.frustumCulled=false;scene.add(plane);

    var nP=small?240:460,pa=new Float32Array(nP*4),pz=new Float32Array(nP*3),i;
    for(i=0;i<nP*4;i++)pa[i]=Math.random();
    var pg=new THREE.BufferGeometry();
    pg.setAttribute('position',new THREE.BufferAttribute(pz,3));
    pg.setAttribute('aP',new THREE.BufferAttribute(pa,4));
    var pm=new THREE.ShaderMaterial({
      uniforms:U,transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending,
      vertexShader:[
        'uniform float uTime,uDisp,uPix,uAspect,uFocus;uniform vec2 uMouse;attribute vec4 aP;varying float vA;',
        'void main(){',
        ' vec2 p=vec2(fract(aP.x+uTime*(.004+aP.w*.01)*(.5+aP.z)+sin(uTime*.3+aP.z*20.)*.02),fract(aP.y+uTime*(.006+aP.w*.012)*(.6+aP.z)));',
        ' vec2 ndc=p*2.-1.;',
        ' ndc+=vec2(cos(aP.z*50.),sin(aP.z*80.))*uDisp*(.2+aP.z*.6);',
        ' vec2 dm=(ndc-uMouse)*vec2(uAspect,1.);float md=length(dm);vec2 pd=md>.0001?dm/md:vec2(0.);',
        ' ndc+=pd*exp(-md*md*9.)*.25/vec2(uAspect,1.);',
        ' float glow=exp(-md*md*14.);',
        ' gl_Position=vec4(ndc,0.,1.);',
        ' gl_PointSize=(2.5+aP.w*7.)*uPix*(1.+glow*.8+uDisp*.8);',
        ' vA=(.35+.65*(.5+.5*sin(uTime*(1.+aP.z*2.)+aP.z*30.)))*(.5+aP.w*.5)*(1.+glow+uDisp*.6)*(1.-uFocus*.45);',
        '}'].join('\n'),
      fragmentShader:[
        'varying float vA;',
        'void main(){vec2 c=gl_PointCoord-.5;float r=length(c)*2.;if(r>1.)discard;',
        ' float a=(smoothstep(.5,.0,r)*.9+pow(1.-r,2.5)*.5)*vA;',
        ' gl_FragColor=vec4(vec3(1.,.93,.66)*a,a);}'].join('\n')
    });
    var pollen=new THREE.Points(pg,pm);pollen.frustumCulled=false;scene.add(pollen);

    function resize(){var w=innerWidth,hh=innerHeight;renderer.setSize(w,hh,false);U.uAspect.value=w/hh;U.uPix.value=renderer.getPixelRatio()*Math.min(1.4,Math.max(.8,hh/900))}
    addEventListener('resize',resize);resize();

    var cu=0,target=0,lastInput=-1e9,speed=0;
    var mt=new THREE.Vector2(9,9),m=new THREE.Vector2(9,9),tilt=new THREE.Vector2(0,0),tiltS=new THREE.Vector2(0,0);
    var tId=null,tY=0;
    function fac(){return 1-U.uDisp.value*.92}
    function setM(e){mt.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);tilt.set(mt.x,mt.y)}
    addEventListener('wheel',function(e){if(bg.view!=='home'||bg.area!=='shop')return;target+=e.deltaY*.0008*fac();lastInput=performance.now()},{passive:true});
    addEventListener('pointermove',function(e){setM(e);if(e.pointerType==='touch'&&tId===e.pointerId&&bg.view==='home'){target+=(tY-e.clientY)*.0016*fac();tY=e.clientY;lastInput=performance.now()}});
    addEventListener('pointerdown',function(e){setM(e);if(e.pointerType==='touch'&&bg.view==='home'&&bg.area==='shop'&&!(e.target.closest&&e.target.closest('.go,.top,.dock,#editbar,.blk-ctl'))){tId=e.pointerId;tY=e.clientY;lastInput=performance.now()}});
    function up(e){if(e.pointerId===tId)tId=null;if(e.pointerType==='touch'){mt.set(9,9);tilt.set(0,0)}}
    addEventListener('pointerup',up);addEventListener('pointercancel',up);
    document.addEventListener('mouseleave',function(){mt.set(9,9);tilt.set(0,0)});

    var lastR=0,time=0,last=performance.now(),frames=0,shown=false,drift=reduce?.008:.018;
    function frame(now){
      requestAnimationFrame(frame);
      var dt=Math.min((now-last)/1000,.05);last=now;
      if(!bg.active)return;
      time+=dt;
      var d=U.uDisp.value;d+=((bg.hover?1:0)-d)*Math.min(1,dt*2.2);U.uDisp.value=d;
      U.uFocus.value+=(bg.focus-U.uFocus.value)*Math.min(1,dt*2.4);
      if(now-lastInput>1500)target+=drift*dt*fac();
      var prev=cu;cu+=(target-cu)*Math.min(1,dt*3.2);
      speed+=((Math.abs(cu-prev)/Math.max(dt,.001))*6-speed)*Math.min(1,dt*3);
      U.uZoom.value=.22*(.5-.5*Math.cos(cu*2.4));
      m.lerp(mt,Math.min(1,dt*6));tiltS.lerp(tilt,Math.min(1,dt*2.5));
      U.uMouse.value.copy(m);U.uTilt.value.copy(tiltS);
      U.uTime.value=time;U.uSpeed.value=Math.min(1,speed);
      if(document.hidden)return;
      if(small&&now-lastR<32)return;
      lastR=now;
      renderer.render(scene,cam);
      frames++;
      if(frames===12&&!shown){shown=true;loader.classList.add('gone')}
    }
    requestAnimationFrame(frame);
  }
  setTimeout(function(){loader.classList.add('gone')},6000);
})();
</script>
