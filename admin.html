<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة إدارة ترياق</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: two separate areas. SHOP = living forest photograph (WebGL) with frosted-glass views (home, store, product pages). ADMIN = its own full-screen app with a sidebar (top strip on phones), one page per section, no forest. Colours come from the photo: forest green, sunlight gold, cream, moss, sky. */
:root{
  --bg:#0B1510; --ink:#F2F4EA; --ink-2:rgba(242,244,234,.78); --ink-3:rgba(242,244,234,.68);
  --gold:#F0C46A; --gold-ink:#1B1407; --moss:#A5CC84; --sky:#97CBEE; --coral:#FFA494; --amber:#F2C46D;
  --glass:rgba(13,26,18,.54); --glass-2:rgba(13,26,18,.72); --glass-line:rgba(255,255,255,.17); --glass-hi:rgba(255,255,255,.14);
  --field:rgba(255,255,255,.09); --field-line:rgba(255,255,255,.22);
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --u:min(calc(100vw/1600),calc(100vh/900));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{direction:rtl}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
body[data-view="home"][data-area="shop"]{touch-action:none;user-select:none;-webkit-user-select:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.25;text-wrap:balance}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#valley{position:fixed;inset:0;background:var(--bg) center/cover no-repeat}
#valley canvas{display:block;width:100%!important;height:100%!important}
.blk{position:relative}

/* ===== glass + entrance ===== */
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:20px;
  box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 50px -20px rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(0px) saturate(1);backdrop-filter:blur(0px) saturate(1)}
.view.on .glass{-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-2)}}
.rise{opacity:0;transform:translateY(22px) scale(.985);
  transition:opacity .55s var(--ease),transform .55s var(--ease),-webkit-backdrop-filter .8s var(--ease),backdrop-filter .8s var(--ease),filter .6s var(--ease)}
.soft{filter:blur(12px)}
.view.on .rise{opacity:1;transform:none;filter:none;transition-duration:.9s,.9s,.9s,.9s,.9s;transition-delay:calc(var(--i,0)*70ms + 140ms)}
.view{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;visibility:hidden;pointer-events:none;transition:visibility 0s linear .9s;-webkit-overflow-scrolling:touch}
.view.on{visibility:visible;pointer-events:auto;transition-delay:0s}
#v-home{overflow:hidden}
.page{max-width:1080px;margin-inline:auto;display:grid;gap:18px;
  padding-top:calc(96px + env(safe-area-inset-top,0px));padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== shop header ===== */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top>*{pointer-events:auto}
.logo{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;text-shadow:0 0 14px rgba(5,12,8,.9),0 1px 3px rgba(5,12,8,.8)}
.nav{display:flex;gap:4px;padding:4px;border-radius:999px;-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi)}
.nav a{display:inline-flex;align-items:center;height:40px;padding:0 20px;border-radius:999px;font-weight:500;font-size:15px;color:var(--ink-2);transition:background .35s var(--ease),color .35s var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:#10150f}
.tools{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-weight:600;transition:transform .3s var(--ease),filter .3s;text-align:center}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn.ghost{background:var(--field);color:var(--ink);border:1px solid var(--field-line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.danger{background:rgba(255,164,148,.16);color:var(--coral);border:1px solid rgba(255,164,148,.5)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:inset 0 1px 0 var(--glass-hi)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .w{transition:opacity .3s}.icon-btn[aria-pressed=false] .w{opacity:0}.icon-btn[aria-pressed=true] .x{opacity:0}

/* ===== home ===== */
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.hero.rise{transform:translateY(calc(-46% + 22px))}
.view.on .hero.rise{transform:translateY(-46%)}
h1.h-title{font-size:calc(132*var(--u));line-height:1.05;text-shadow:0 2px 40px rgba(5,12,8,.7),0 0 6px rgba(5,12,8,.35)}
.cap{margin-top:calc(34*var(--u));font-size:calc(22*var(--u));line-height:1.65;white-space:pre-line;text-shadow:0 1px 18px rgba(5,12,8,.85),0 0 4px rgba(5,12,8,.4)}
.go{display:grid;place-items:center;margin-top:calc(30*var(--u));width:calc(62*var(--u));height:calc(62*var(--u));min-width:52px;min-height:52px;border:1.5px solid var(--ink);border-radius:50%;background:rgba(11,21,16,.28);transition:background .35s,color .35s;touch-action:none}
.go:hover,.go.held{background:var(--ink);color:#10150f}
.go svg{width:calc(24*var(--u));height:calc(24*var(--u));min-width:20px;min-height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hint{position:absolute;display:flex;align-items:center;gap:14px;font-size:15px;font-weight:500;text-shadow:0 1px 12px rgba(5,12,8,.8);
  inset-inline-end:max(44px,env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.hint i{width:1px;height:24px;background:var(--glass-line)}

/* ===== store ===== */
.intro{padding:18px 22px}
.intro h2{font-size:clamp(30px,5vw,44px);text-shadow:0 2px 24px rgba(5,12,8,.6)}
.intro p{color:var(--ink-2);max-width:56ch}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.trust>div{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;font-size:15px}
.trust svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.card{display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative;transition:transform .3s var(--ease),opacity .9s var(--ease)}
.card:hover{transform:translateY(-3px)}
.card .pic{display:grid;place-items:center;height:176px;background:radial-gradient(70% 80% at 50% 45%,rgba(240,196,106,.22),rgba(240,196,106,0) 70%)}
.card .pic svg{height:140px;width:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.card .body{display:flex;flex-direction:column;gap:6px;padding:4px 16px 16px;flex:1}
.card h3{font-size:19px}
.card .meta{color:var(--ink-2);font-size:14px}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.cue{font-size:14px;font-weight:600;color:var(--gold)}
.price{font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.price s,.pprice s{color:var(--ink-3);font-weight:400;font-size:13px;margin-inline-start:8px}
.tag{align-self:flex-start;font-size:12px;font-weight:600;color:var(--gold-ink);background:var(--gold);border-radius:99px;padding:1px 10px}
.stk{display:inline-block;align-self:flex-start;font-size:13px;font-weight:600;border-radius:99px;padding:1px 12px;border:1px solid currentColor}
.stk.ok{color:var(--moss)}.stk.low{color:var(--amber)}.stk.out{color:var(--coral)}
.vis-ctl{position:absolute;top:10px;inset-inline-end:10px;z-index:3;padding:4px 12px;border-radius:99px;background:var(--ink);color:#10150f;font-size:13px;font-weight:600;display:none}
body.editing .vis-ctl{display:block}
.h2{font-size:clamp(24px,4vw,32px);margin-top:10px;text-shadow:0 2px 20px rgba(5,12,8,.6)}
.foot{display:grid;gap:4px;padding-top:18px;color:var(--ink-3);font-size:13px;text-shadow:0 1px 10px rgba(5,12,8,.8)}
.foot a{text-decoration:underline;text-underline-offset:3px}

/* ===== product page ===== */
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);text-shadow:0 1px 10px rgba(5,12,8,.8)}
.crumbs a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
@media (max-width:780px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.ppic{display:grid;place-items:center;min-height:340px;background-image:radial-gradient(60% 60% at 50% 48%,rgba(240,196,106,.24),rgba(240,196,106,0) 72%)}
.ppic svg{height:300px;width:auto;max-width:100%;filter:drop-shadow(0 18px 26px rgba(0,0,0,.5))}
.pinfo{padding:22px;display:grid;gap:12px;align-content:start}
.ptitle{font-size:clamp(26px,4vw,36px)}
.pprice b{font-size:28px;font-variant-numeric:tabular-nums}
.pdesc{color:var(--ink-2)}
.pfeat{list-style:none;display:grid;gap:8px}
.pfeat li{display:flex;gap:10px;align-items:flex-start}
.pfeat li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:11px}
.pfeat li span{flex:1}
.li-del,.add-feat{display:none}
body.editing .li-del{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#2a0d08;font-weight:700}
body.editing .add-feat{display:inline-flex}
.order{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:780px){.order{grid-template-columns:minmax(0,1fr)}}
.panel{padding:20px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.fields{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
label,.lbl{font-size:14px;font-weight:500;color:var(--ink-2)}
input,select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;background:var(--field);border:1px solid var(--field-line);transition:border-color .25s,background .25s}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.12)}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--coral)}
select option{background:#14241A;color:var(--ink)}
.err{color:var(--coral);font-size:13px;min-height:1.3em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg label{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--field-line);background:var(--field);cursor:pointer;color:var(--ink);transition:border-color .25s,background .25s}
.seg input{width:auto;min-height:0;accent-color:var(--gold)}
.seg label:has(input:checked){border-color:var(--gold);background:rgba(240,196,106,.16)}
.qty{display:flex;align-items:center;width:max-content;border-radius:12px;border:1px solid var(--field-line);background:var(--field);overflow:hidden}
.qty button{width:46px;height:46px;font-size:20px}
.qty output{min-width:38px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.sum h3{font-size:19px;margin-bottom:12px}
.sum dl{display:grid;gap:10px}
.sum .r{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sum .r.t{border-top:1px dashed var(--glass-line);padding-top:12px;font-weight:600;font-size:18px}
.sum .r.d dd{color:var(--moss)}
.sum dt{color:var(--ink-2)}.sum dd{margin:0;font-variant-numeric:tabular-nums;text-align:end}
.note{font-size:13px;color:var(--ink-3)}
.done{display:none;padding:20px;border-color:rgba(165,204,132,.6)}
.done.show{display:block;animation:fadeUp .8s var(--ease)}
.done h3{color:var(--moss);font-size:22px;margin-bottom:4px}
.buybar{display:none;position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding:10px 12px;border-radius:20px;gap:12px;align-items:center;justify-content:space-between;background:var(--glass-2);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 40px -16px rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3)}
.buybar div{min-width:0}.buybar b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buybar span{font-size:14px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ===== live edit mode ===== */
.blk-ctl{display:none;position:absolute;top:-12px;inset-inline-start:-12px;z-index:4;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#2a0d08;font-weight:700;font-size:17px;line-height:1;place-items:center}
body.editing .blk-ctl{display:grid}
.ghost .blk-ctl{background:var(--moss)}
.is-hidden{display:none!important}
body.editing .ghost{opacity:.4!important}
body.editing [contenteditable="true"]{outline:1px dashed rgba(240,196,106,.75);outline-offset:4px;border-radius:4px;cursor:text}
body.editing [contenteditable="true"]:focus{outline:2px solid var(--gold)}
#editbar{display:none;position:fixed;z-index:8;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);
  gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 14px;border-radius:18px;background:var(--glass-2);border:1px solid var(--gold);box-shadow:0 14px 40px -10px rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
body.editing #editbar{display:flex}
#editbar span{font-size:14px;font-weight:500}
body.editing .dock{display:none}

/* ===== loader + dock ===== */
.dock{display:none}
.loader{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--bg);transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}

/* ===== ADMIN (separate page) ===== */
#admin{display:none;position:fixed;inset:0;z-index:6;color:var(--ink);
  background:radial-gradient(60% 50% at 85% 0%,rgba(240,196,106,.10),transparent 60%),radial-gradient(50% 60% at 0% 100%,rgba(165,204,132,.10),transparent 60%),#0A1410}
body[data-area="admin"] #admin{display:block}
body[data-area="admin"] .top,body[data-area="admin"] .dock,body[data-area="admin"] .buybar,body[data-area="admin"] main,body[data-area="admin"] #valley,body[data-area="admin"] #editbar{display:none!important}
body[data-area="admin"]{touch-action:auto}
#adm-gate{height:100%;display:grid;place-items:center;padding:16px;overflow:auto}
.gate{width:min(420px,100%);padding:24px;display:grid;gap:14px}
.gate h2{font-size:26px}
#adm-shell{height:100%;display:grid;grid-template-columns:252px minmax(0,1fr)}
.sb{display:flex;flex-direction:column;gap:4px;overflow-y:auto;border-inline-end:1px solid var(--glass-line);background:rgba(255,255,255,.03);
  padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px))}
.sb .brand{font-family:var(--f-display);font-weight:700;font-size:28px;padding:4px 10px 14px}
.sb a,.sb button.sbl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink-2);font-weight:500;text-align:start;transition:background .3s var(--ease),color .3s var(--ease)}
.sb a:hover,.sb button.sbl:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.sb a[aria-current="page"]{background:var(--ink);color:#10150f}
.sb .sp{flex:1}
.bdg{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.am{overflow-y:auto;padding:calc(26px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-left,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-right,0px))}
.amw{max-width:980px;margin-inline:auto;display:grid;gap:14px}
.ah{display:grid;gap:2px;margin-bottom:4px}
.ah h1{font-size:32px}
.ah p{color:var(--ink-2)}
.ap{background:rgba(255,255,255,.055);border:1px solid var(--glass-line);border-radius:18px;padding:18px;display:grid;gap:12px;min-width:0;align-content:start}
.ap-t{font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:rgba(255,255,255,.055);border:1px solid var(--glass-line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2);font-size:14px}
.demo{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--gold);border:1px solid rgba(240,196,106,.5);border-radius:99px;padding:0 10px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap}
.tab2{padding:6px 14px;border-radius:99px;border:1px solid var(--field-line);background:var(--field);font-size:14px;font-weight:500}
.tab2[aria-pressed="true"]{background:var(--ink);color:#10150f;border-color:var(--ink)}
.chip{font-size:12px;font-weight:600;border-radius:99px;padding:1px 10px;border:1px solid currentColor}
.chip.warn{color:var(--amber)}.chip.bad{color:var(--coral)}
.pill2{font-size:13px;font-weight:600;border-radius:99px;padding:2px 12px;border:1px solid currentColor}
.pill2.p{color:var(--amber)}.pill2.c{color:var(--moss)}.pill2.s{color:var(--sky)}.pill2.x{color:var(--coral)}
.mono{font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}
.ph{font-family:var(--f-mono);direction:ltr;unicode-bidi:embed;display:inline-block}

  function chartSVG(counts,labels){
    var W=560,HT=230,L=34,R=10,T=24,B=34,mx=Math.max(4,Math.max.apply(null,counts));mx=Math.ceil(mx/2)*2;
    var iw=W-L-R,ih=HT-T-B,step=iw/counts.length,bw=step*.56,i;
    var s='<svg viewBox="0 0 '+W+' '+HT+'" role="img" aria-label="عدد الطلبات في آخر 7 أيام" style="width:100%;min-width:420px;height:auto;direction:ltr">';
    [0,mx/2,mx].forEach(function(v){var y=T+ih*(1-v/mx);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--glass-line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" style="fill:var(--ink-3)">'+v+'</text>'});
    for(i=0;i<counts.length;i++){
      var x=L+(counts.length-1-i)*step+(step-bw)/2,bh=ih*counts[i]/mx,y2=T+ih-bh;
      s+='<rect x="'+x+'" y="'+y2+'" width="'+bw+'" height="'+bh+'" rx="5" style="fill:var(--gold)" opacity="'+(i===counts.length-1?1:.72)+'"/>';
      s+='<text x="'+(x+bw/2)+'" y="'+(y2-6)+'" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--ink)">'+counts[i]+'</text>';
      s+='<text x="'+(x+bw/2)+'" y="'+(HT-12)+'" text-anchor="middle" font-size="12" style="fill:var(--ink-2)">'+labels[i]+'</text>';
    }
    return s+'</svg>';
  }

  /* ---- settings ---- */
  function adminSettings(w){
    var s=S.settings,p=panel('بيانات المتجر');

    var ph=inp('s-phone','text',s.phone);ph.setAttribute('dir','ltr');ph.addEventListener('input',function(){s.phone=ph.value;save()});
    var wa=inp('s-wa','text',s.whatsapp,'0555123456 أو https://wa.me/213555123456');wa.setAttribute('dir','ltr');
    var wn=h('span','note');
    function waCheck(){
      var v=wa.value.trim(),ok=false,t='';
      if(!v){t='لا يوجد واتساب: زر واتساب مخفي في صفحة المنتج.'}
      else if(/^https:\/\/(wa\.me|api\.whatsapp\.com|wa\.link|chat\.whatsapp\.com)\/[^\s<>"']+$/i.test(v)){ok=true;t='سيظهر الزر ويفتح هذا الرابط.'}
      else if(/^https?:/i.test(v)){t='الرابط غير مقبول. استعمل رابط wa.me أو رقمًا. سيبقى الزر مخفيًا.'}
      else{var d=digits(v).replace(/^00/,'');if(d.charAt(0)==='0')d='213'+d.slice(1);if(/^\d{9,15}$/.test(d)){ok=true;t='سيظهر الزر ويفتح واتساب على الرقم +'+d}else t='الرقم غير صحيح. سيبقى الزر مخفيًا.'}
      wn.textContent=t;wn.style.color=ok||!v?'':'var(--coral)';
    }
    wa.addEventListener('input',function(){s.whatsapp=wa.value;waCheck();save()});waCheck();
    var g=h('div','g3');g.appendChild(fld('اسم المتجر',nm));g.appendChild(fld('هاتف المتجر',ph));var wf=fld('واتساب المتجر (رقم أو رابط)',wa);wf.appendChild(wn);g.appendChild(wf);p.appendChild(g);
    p.appendChild(sw('s-dup',s.dupAlert,'تنبيه تكرار الهاتف في الطلبات',function(v){s.dupAlert=v;save()}));w.appendChild(p);

    var pr=panel('حماية الطلبات');
    var ac=inp('s-ac','number',s.autoCancelHours===undefined?48:s.autoCancelHours);ac.min='0';ac.max='720';ac.setAttribute('dir','ltr');
    ac.addEventListener('input',function(){s.autoCancelHours=ac.value===''?'':+ac.value;save()});
    var mp=inp('s-mp','number',s.maxPerPhone===undefined?4:s.maxPerPhone);mp.min='0';mp.max='50';mp.setAttribute('dir','ltr');
    mp.addEventListener('input',function(){s.maxPerPhone=mp.value===''?'':+mp.value;save()});
    var pg=h('div','g2');
    pg.appendChild(fld('إلغاء الطلب غير المؤكد تلقائيًا بعد (ساعات)',ac,'يُلغى الطلب «قيد التأكيد» ويعود مخزونه. اكتب 0 للتعطيل. يعمل بعد تشغيل الدالة installTriggers مرة واحدة في Apps Script.'));
    pg.appendChild(fld('أقصى عدد طلبات لنفس الرقم خلال 6 ساعات',mp,'اكتب 0 للتعطيل. أثناء التجربة بهاتفك قد تحتاج رفعه مؤقتًا.'));
    pr.appendChild(pg);w.appendChild(pr);

    var b=panel('الأرقام المحظورة');var list=h('div','list');list.style.maxHeight='none';
    function drawBlocked(){list.innerHTML='';if(!s.blocked.length)list.appendChild(h('p','note','لا أرقام محظورة.'));s.blocked.forEach(function(n,i){var r=h('div','attn');var li=h('li');li.appendChild(h('span','ph',n));li.appendChild(btn('إزالة','btn ghost sm',function(){s.blocked.splice(i,1);save();drawBlocked()}));r.appendChild(li);list.appendChild(r)})}
    var bi=inp('b-new','text','','05XXXXXXXX');bi.setAttribute('dir','ltr');var bo=h('span');
    var row=h('div','acts');row.style.alignItems='end';var f=fld('رقم جديد',bi);f.style.minWidth='200px';row.appendChild(f);
    row.appendChild(btn('حظر الرقم','btn sm',function(){var d=digits(bi.value);if(!/^0[567]\d{8}$/.test(d)){msg(bo,'رقم غير صحيح',true);return}if(s.blocked.some(function(x){return digits(x)===d})){msg(bo,'الرقم محظور سابقًا',true);return}s.blocked.push(d);save();bi.value='';bo.textContent='';drawBlocked()}));
    b.appendChild(list);b.appendChild(row);b.appendChild(bo);w.appendChild(b);drawBlocked();

    var k=panel('نسخة احتياطية');
    k.appendChild(h('p','note','تحفظ النسخة المنتجات والنصوص والإعدادات والطلبات وسجل الأحداث. لا تحفظ أي token أو رمز سري. احتفظ بها في مكان آمن ثم الصقها هنا للاستعادة بضغطة واحدة.'));
    var ex=h('textarea');ex.id='bk-out';ex.readOnly=true;ex.value=JSON.stringify(S);
    var ko=h('span');
    var ra=h('div','acts');
    ra.appendChild(btn('نسخ النسخة الاحتياطية','btn sm',function(){
      ex.value=JSON.stringify(S);
      var fb=function(){ex.select();msg(ko,'حدّد النص أعلاه وانسخه يدويًا',true)};
      try{navigator.clipboard.writeText(ex.value).then(function(){msg(ko,'تم النسخ')},fb)}catch(e){fb()}
    }));
    k.appendChild(ex);k.appendChild(ra);
    var im=h('textarea');im.id='bk-in';im.placeholder='الصق النسخة الاحتياطية هنا';
    var ri=h('div','acts');
    ri.appendChild(btn('استعادة النسخة','btn sm',function(){
      try{
        var o=JSON.parse(im.value);if(!o||o.v!==2||!Array.isArray(o.products)||!Array.isArray(o.orders))throw new Error('x');
        ['products','content','settings','delivery','pixel','tg','orders','seq','logs','tgLog','theme'].forEach(function(key){if(o[key]!==undefined)S[key]=o[key]});
        save();applyContent();msg(ko,'تمت الاستعادة');refreshAdminKeep();
      }catch(e){msg(ko,'النسخة غير صالحة',true)}
    }));
    k.appendChild(im);k.appendChild(ri);k.appendChild(ko);
    k.appendChild(confirmBtn('إعادة ضبط كل شيء إلى البيانات التجريبية','btn danger sm',function(){S=defaults();save();applyContent();refreshAdminKeep()}));
    if(LIVE){var lk=panel('الحفظ');lk.appendChild(h('p','note','بياناتك محفوظة في Google Sheets الخاص بك، ويمكنك الاطلاع عليها وتنزيلها من هناك مباشرة.'));w.appendChild(lk)}else w.appendChild(k);
  }

  /* gate */
  $('gate').addEventListener('submit',function(e){
    e.preventDefault();
    if(LIVE){
      var pw=$('pw').value,eb=$('e-pw');eb.textContent='جارٍ التحقق…';
      api('login',{},pw).then(function(r){
        if(!r||!r.ok){eb.textContent=(r&&r.msg)||'كلمة السر غير صحيحة';$('pw').setAttribute('aria-invalid','true');return}
        KEYV=r.token;sessStart();loadAdmin(r);authed=true;eb.textContent='';$('pw').value='';route();
      }).catch(function(){eb.textContent='تعذّر الاتصال بالخادم'});
      return;
    }
    if($('pw').value==='1234'){authed=true;$('e-pw').textContent='';$('pw').value='';route()}
    else{$('e-pw').textContent='كلمة السر غير صحيحة';$('pw').setAttribute('aria-invalid','true')}
  });
  /* ================= ROUTER (admin only) ================= */
  function route(){
    var x=(location.hash||'').replace('#','');if(x==='admin'||!x)x='admin-home';
    var m=/^admin-(home|orders|products|storeedit|delivery|pixel|telegram|editor|settings)$/.exec(x);
    adminCur=m?m[1]:'home';bg.area='admin';
    document.body.setAttribute('data-area','admin');
    $('adm-gate').hidden=authed||restoring;$('adm-shell').hidden=!(authed||restoring);
    var s=SECS.filter(function(z){return z[0]===adminCur})[0];
    document.title=S.settings.storeName+' · '+(authed?s[1]:'لوحة الإدارة');
    if(authed){drawSidebar();runAdmin()}
    else if(restoring){drawSidebar();$('adm-main').innerHTML='<div class="amw"><p class="note">جارٍ تحميل البيانات…</p></div>'}
  }

  (function(){
    var ind=document.createElement('div');ind.className='ptr';ind.textContent='اسحب للتحديث';document.body.appendChild(ind);
    var y0=0,dy=0,act=false;
    function scr(el){while(el&&el!==document.documentElement){if(el.scrollHeight>el.clientHeight+2){var o=getComputedStyle(el).overflowY;if(o==='auto'||o==='scroll')return el}el=el.parentElement}return null}
    addEventListener('touchstart',function(e){
      act=false;dy=0;if(e.touches.length!==1)return;
      var t=e.target;if(t.closest&&t.closest('input,textarea,select,[contenteditable],#editbar,.ve-grip,.ve-w,.ve-hh,#ve'))return;
      if(false)return;
      var s=scr(t);if(s&&s.scrollTop>0)return;
      y0=e.touches[0].clientY;act=true;
    },{passive:true});
    addEventListener('touchmove',function(e){
      if(!act)return;dy=e.touches[0].clientY-y0;
      if(dy<=0){ind.style.top='-50px';return}
      ind.style.top=(Math.min(dy*.45,80)-40)+'px';ind.textContent=dy>110?'أفلت للتحديث':'اسحب للتحديث';
    },{passive:true});
    function end(){if(act&&dy>110){ind.textContent='جارٍ التحديث…';ind.style.top='20px';location.reload()}else ind.style.top='-50px';act=false;dy=0}
    addEventListener('touchend',end,{passive:true});addEventListener('touchcancel',end,{passive:true});
  })();
  var restoring=false,fromCache=false;
  if(LIVE){S.products=[];S.orders=[];S.logs=[];S.tgLog=[]}
  try{
    var s0=JSON.parse(localStorage.getItem('tiryaq-sess')||'null');
    restoring=!!(LIVE&&s0&&s0.t&&Date.now()-s0.ts<1800000);
    if(restoring){
      var ca=JSON.parse(sessionStorage.getItem('tiryaq-acache')||'null');
      if(ca&&ca.d&&Date.now()-ca.ts<1800000){KEYV=s0.t;loadAdmin(ca.d);authed=true;restoring=false;fromCache=true}
    }
  }catch(e){}
  addEventListener('hashchange',route);
  route();
  if(LIVE){
    var gn=document.querySelector('#adm-gate .note');if(gn)gn.textContent='أدخل كلمة سر الإدارة.';
    try{
      var ss=JSON.parse(localStorage.getItem(SESSK)||'null');
      if(ss&&ss.t&&Date.now()-ss.ts<IDLE){
        KEYV=ss.t;
        api('adminData').then(function(r){
          restoring=false;
          if(r&&r.ok){
            if(authed){
              if(!syncT&&!syncP&&!Object.keys(noteT).length){
                var a=document.activeElement;
                if(!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable))){
                  var b4=JSON.stringify([S.products,S.orders,S.content,S.settings,S.delivery,S.pixel,S.tg,S.theme]);
                  loadAdmin(r);
                  if(JSON.stringify([S.products,S.orders,S.content,S.settings,S.delivery,S.pixel,S.tg,S.theme])!==b4)refreshAdminKeep();
                }
              }
            }else{loadAdmin(r);authed=true;sessTouch();route()}
          }else if(authed){doLogout('انتهت الجلسة. أدخل كلمة السر.')}
          else{KEYV='';try{localStorage.removeItem(SESSK)}catch(e){}route()}
        }).catch(function(){if(!authed){restoring=false;KEYV='';route();$('e-pw').textContent='تعذّر استعادة الجلسة، أدخل كلمة السر'}});
      }
    }catch(e){}
    ['pointerdown','keydown','touchstart'].forEach(function(ev){addEventListener(ev,sessTouch,{passive:true})});
    setInterval(function(){if(authed&&Date.now()-lastAct>IDLE)doLogout('انتهت الجلسة بعد 30 دقيقة دون استعمال. أدخل كلمة السر.')},30000);
    setInterval(function(){
      if(!authed||syncP||syncT||Object.keys(noteT).length)return;
      var a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable))return;
      var before=JSON.stringify(S.orders);
      pullAdmin(false).then(function(){if(JSON.stringify(S.orders)!==before)refreshAdminKeep()});
    },45000);
  }
})();
